[project]
name = "videoagent"
version = "0.1.0"
description = "LangGraph multi-agent pipeline that generates and publishes short-form videos"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    "langgraph>=0.6,<0.8",
    "langchain-core>=0.3,<0.4",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "httpx>=0.28,<1",
    "python-dotenv>=1.0,<2",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<2",
    "ruff>=0.8,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/videoagent"]

# ---------------------------------------------------------------------------
# Tooling. The single entry point that runs all of this is `scripts/check.py`:
#     .venv/Scripts/python.exe scripts/check.py     (Windows)
#     .venv/bin/python scripts/check.py             (Unix)
#     uv run scripts/check.py                       (either)
# ---------------------------------------------------------------------------

[tool.ruff]
target-version = "py312"
# 100, not the default 88: the existing docstrings run to 99 columns and reflowing
# prose to fit 88 hurts readability more than the extra 12 columns cost.
line-length = 100
src = ["src", "tests", "scripts"]
extend-exclude = [".venv", ".venv-tools", "ui"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort — import ordering
    "UP",  # pyupgrade — keep syntax modern for py312
    "B",   # flake8-bugbear — likely bugs
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
    "RUF", # ruff-specific (includes RUF100: unused noqa)
]

[tool.ruff.lint.isort]
known-first-party = ["videoagent"]

[tool.ruff.format]
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# --strict-markers/--strict-config turn typos in markers and ini keys into errors
# instead of silent no-ops.
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
# pytest-asyncio: `auto` means plain `async def test_*` functions just run. The
# project is async-heavy (CLAUDE.md 7), and under the default `strict` mode an
# async test missing @pytest.mark.asyncio is silently skipped rather than failing.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
